    <script>
      const header = document.getElementById("site-header");
      const divider = document.getElementById("header-divider")?.firstElementChild;
      const navToggle = document.getElementById("nav-toggle");
      const mobileNav = document.getElementById("mobile-nav");
      const mobileNavBackdrop = document.getElementById("mobile-nav-backdrop");

      function syncHeader() {
        const scrolled = window.scrollY > 12;
        header.classList.toggle("bg-white/0", !scrolled);
        header.classList.toggle("bg-white/70", scrolled);
        header.classList.toggle("backdrop-blur-md", scrolled);
        header.classList.toggle("border-b", scrolled);
        header.classList.toggle("border-ink/10", scrolled);
        if (divider) divider.classList.toggle("bg-ink/10", scrolled);
      }

      function setMobileNav(open) {
        if (!navToggle || !mobileNav) return;
        navToggle.setAttribute("aria-expanded", open ? "true" : "false");
        mobileNav.setAttribute("aria-hidden", open ? "false" : "true");
        mobileNav.classList.toggle("opacity-0", !open);
        mobileNav.classList.toggle("opacity-100", open);
        mobileNav.classList.toggle("pointer-events-none", !open);
        mobileNav.classList.toggle("pointer-events-auto", open);
        document.body.classList.toggle("overflow-hidden", open);
      }

      navToggle?.addEventListener("click", () => {
        const open = navToggle.getAttribute("aria-expanded") !== "true";
        setMobileNav(open);
      });

      mobileNavBackdrop?.addEventListener("click", () => setMobileNav(false));
      mobileNav?.querySelectorAll("[data-nav-close]")?.forEach((link) => link.addEventListener("click", () => setMobileNav(false)));
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setMobileNav(false);
      });

      document.getElementById("year").textContent = String(new Date().getFullYear());
      window.addEventListener("scroll", syncHeader, { passive: true });
      syncHeader();
      window.addEventListener("DOMContentLoaded", () => document.body.classList.add("is-ready"));
    </script>
